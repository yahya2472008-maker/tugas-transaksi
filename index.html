<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pembayaran / Riwayat Transaksi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">

    <div class="container">
        <h1>Selamat Datang di Data Pembayaran</h1>

        <div class="action-buttons">
            <button class="btn btn-close" id="closeBtn">Tutup Riwayat Transaksi</button>
            <button class="btn btn-mode" id="modeToggleBtn">🌙 Mode Dark</button>
        </div>

        <div class="transaction-list" id="transactionList">
            <!-- Kartu Transaksi akan dimuat lewat JS -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
